name: Check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Check types, build, and test
        run: npm run check
      - name: Build the local playground
        run: npm run playground:build
      - name: Build the self-hosted release
        run: npm run release:build
      - name: Retain the checked download for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swarm-protocol-check-${{ github.run_id }}
          path: |
            artifacts/swarm-protocol-drop-in-*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  tag-version:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-version
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the checked version once
        shell: bash
        run: |
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          tag="v$version"
          git check-ref-format "refs/tags/$tag"
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "$tag already exists; keeping its original commit."
            exit 0
          fi
          git tag "$tag"
          git push origin "refs/tags/$tag"
