name: Release

on:
  push:
    tags: ['v*']
  # GitHub emits this for branches created through its UI or Git references API.
  # Only an explicitly named release branch is allowed through the job gate.
  create:

permissions:
  contents: read

jobs:
  verify:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      create_tag: ${{ steps.version.outputs.create_tag }}
      commit: ${{ steps.version.outputs.commit }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Require the exact package version and commit
        id: version
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release-version.mjs "$RELEASE_REF" "$RELEASE_REF_TYPE"
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$RELEASE_SHA"
          printf 'commit=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Check types, build, and test
        run: npm run check
      - name: Build the self-hosted release
        run: npm run release:build
      - name: Package the verified npm build
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pack --ignore-scripts --pack-destination artifacts
          cd artifacts
          sha256sum "chriscooley-swarm-protocol-${RELEASE_VERSION}.tgz" >> SHA256SUMS.txt
      - name: Keep the verified release files
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swarm-protocol-${{ steps.version.outputs.version }}
          path: |
            artifacts/swarm-protocol-drop-in-${{ steps.version.outputs.version }}.zip
            artifacts/chriscooley-swarm-protocol-${{ steps.version.outputs.version }}.tgz
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Both tag and branch requests for the same version share this lock.
    concurrency:
      group: release-${{ needs.verify.outputs.tag }}
      cancel-in-progress: false
    # Build/install steps run in the read-only job above. This job only uploads
    # those verified bytes and, for a release branch, creates its matching tag.
    # It never publishes npm or changes source branches.
    permissions:
      contents: write
    steps:
      - name: Download this run's verified artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: artifacts
          digest-mismatch: error
      - name: Verify the archive checksum
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish a new version without replacing an old release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_SHA: ${{ needs.verify.outputs.commit }}
          CREATE_TAG: ${{ needs.verify.outputs.create_tag }}
        shell: bash
        run: |
          set -euo pipefail
          archive="artifacts/swarm-protocol-drop-in-${RELEASE_VERSION}.zip"
          package_archive="artifacts/chriscooley-swarm-protocol-${RELEASE_VERSION}.tgz"
          test -s "$archive"
          test -s "$package_archive"
          test -s artifacts/SHA256SUMS.txt

          existing="$(gh api --paginate "repos/${GH_REPO}/releases?per_page=100" --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | .id")"
          if [[ -n "$existing" ]]; then
            echo "::error::A release or draft already exists for ${RELEASE_TAG}. Review it manually; this workflow never replaces release assets or reuses a published version."
            exit 1
          fi

          if [[ "$CREATE_TAG" == 'true' ]]; then
            # A release branch can only publish the exact current main commit.
            # Do not silently release a changed branch or a moved main ref.
            main_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
            test "$main_sha" = "$RELEASE_SHA" || {
              echo '::error::The release branch commit must still be the tip of main.'
              exit 1
            }
            existing_tag="$(gh api "repos/${GH_REPO}/git/matching-refs/tags/${RELEASE_TAG}" --jq ".[] | select(.ref == \"refs/tags/${RELEASE_TAG}\") | .object.sha")"
            if [[ -n "$existing_tag" ]]; then
              echo "::error::Tag ${RELEASE_TAG} already exists. It will not be moved or reused by a release branch."
              exit 1
            fi
            gh api --method POST "repos/${GH_REPO}/git/refs" \
              -f "ref=refs/tags/${RELEASE_TAG}" -f "sha=${RELEASE_SHA}" > /dev/null
          fi

          # Resolve lightweight and annotated tags to their commit, and ensure
          # the release uses precisely the source that passed the verification job.
          tag_sha="$(gh api "repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq '.sha')"
          test "$tag_sha" = "$RELEASE_SHA" || {
            echo '::error::The release tag does not resolve to the verified commit.'
            exit 1
          }

          cat > "$RUNNER_TEMP/swarm-release-notes.md" <<'NOTES'
          Download the versioned `swarm-protocol-drop-in-*.zip` asset and follow its README to copy the game into an Astro or static site. No npm installation or runtime GitHub request is required.

          Keep the complete version folder to pin this release. Verify the download against `SHA256SUMS.txt` if desired. Future versions are separate releases; installing an update is explicit.

          The autogenerated source archives are for development. The drop-in ZIP contains the prebuilt game, Astro component, browser test, and installation guide.

          For an npm-managed Astro integration, install the versioned download URL of the `chriscooley-swarm-protocol-*.tgz` asset. The package includes the deferred entry and Astro integration template documented in `docs/API.md`. Commit your package manifest and lockfile; no npm registry publication is required.
          NOTES

          # Create a draft, attach everything, then publish. If a step fails,
          # leave the draft for review rather than deleting/replacing anything.
          gh release create "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --verify-tag \
            --draft \
            --title "Swarm Protocol ${RELEASE_VERSION}" \
            --notes-file "$RUNNER_TEMP/swarm-release-notes.md" \
            --generate-notes
          gh release upload "$RELEASE_TAG" "$archive" "$package_archive" artifacts/SHA256SUMS.txt --repo "$GH_REPO"
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --verify-tag --draft=false
