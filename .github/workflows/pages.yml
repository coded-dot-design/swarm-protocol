name: Redirect to the DOM Virus game page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write the redirect page
        run: |
          mkdir -p public
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>Moved to DOM Virus</title>
              <link rel="canonical" href="https://domvirus.com/games/swarm-protocol/" />
              <meta http-equiv="refresh" content="0; url=https://domvirus.com/games/swarm-protocol/" />
            </head>
            <body>
              <p>This game now lives on <a href="https://domvirus.com/games/swarm-protocol/">DOM Virus</a>.</p>
            </body>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the redirect
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
